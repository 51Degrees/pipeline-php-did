# Publish a release of the package.
#
# The package cannot be published straight from main. main keeps the OWID
# library as a git submodule and consumes it through a Composer "path"
# repository, and neither survives publication, because Packagist serves
# GitHub's archive of the tag and a git archive writes a submodule as an
# empty directory. This workflow assembles the tree that is published, so
# the OWID source exists in published tags and never on main.
#
# Start a release by pushing a source tag, for example
#
#   git tag release/1.0.0 && git push origin release/1.0.0
#
# which publishes the tag 1.0.0, following the bare version tags of the
# other 51Degrees PHP packages. Packagist reads the published tag and
# ignores the source tag, which is not a version number. The workflow can
# also be run by hand, with a dry run that assembles and checks the
# package and pushes nothing.

name: Publish

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 1.0.0'
        type: string
        required: true
      dryrun:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  Publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Read the version and whether this is a dry run
        id: release
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#release/}"
            dryrun=false
          else
            version="${{ inputs.version }}"
            dryrun="${{ inputs.dryrun }}"
          fi
          if ! echo "$version" | grep -Eq \
            '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'; then
            echo "'$version' is not a version number such as 1.0.0" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dryrun=$dryrun" >> "$GITHUB_OUTPUT"
          echo "Publishing $version, dry run $dryrun"

      - name: Checkout with the OWID submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Refuse to replace a version that is already published
        if: steps.release.outputs.dryrun != 'true'
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version"; then
            echo "Tag $version is already published, choose a new version" >&2
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, openssl, json

      - name: Assemble the package
        run: ci/assemble-package.sh "$RUNNER_TEMP/package"

      - name: Check the package the way a consumer sees it
        run: |
          set -euo pipefail
          # Check a copy, so the files installed and generated by the
          # check stay out of the tree that is published.
          rm -rf "$RUNNER_TEMP/verify"
          cp -R "$RUNNER_TEMP/package" "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          composer validate --strict
          # A consumer has no path repository, so this resolves only if
          # every requirement is on Packagist or built into PHP.
          composer install --no-dev --no-interaction --no-progress
          # Builds and parses a 51Did using nothing but the package, so
          # it fails if the copied OWID source is missing or unreachable.
          php examples/fodid_example.php
          composer install --no-interaction --no-progress
          php vendor/phpunit/phpunit/phpunit --testsuite Unit

      - name: Build the published commit and tag
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          source_commit="$(git rev-parse HEAD)"
          git config user.name 'Automation51D'
          git config user.email '51DCI@51Degrees.com'
          git switch --detach "$source_commit"
          # Replace the checkout with the assembled package, so the
          # published commit holds the package and nothing else while
          # keeping the source commit as its parent for provenance.
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R "$RUNNER_TEMP/package"/. .
          git add -A -f
          git commit -q -m "Release $version" -m \
            "Assembled from $source_commit with the OWID source copied in."
          git tag -a "$version" -m "Release $version"
          git show --stat --oneline HEAD

      - name: Check that the published tag archives with the OWID source
        run: |
          set -euo pipefail
          version='${{ steps.release.outputs.version }}'
          # Packagist serves this archive, so this is the check the whole
          # workflow exists for.
          git archive --format=tar "$version" > "$RUNNER_TEMP/published.tar"
          tar -tf "$RUNNER_TEMP/published.tar" | sort \
            > "$RUNNER_TEMP/published.txt"
          cat "$RUNNER_TEMP/published.txt"
          grep -q 'third-party/swan-community/owid/src/Owid.php' \
            "$RUNNER_TEMP/published.txt" || {
              echo "the archive of $version carries no OWID source" >&2
              exit 1
            }

      - name: Push the published tag
        if: steps.release.outputs.dryrun != 'true'
        run: git push origin "refs/tags/${{ steps.release.outputs.version }}"

      - name: Keep the assembled package from a dry run
        if: steps.release.outputs.dryrun == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ steps.release.outputs.version }}
          path: ${{ runner.temp }}/package
